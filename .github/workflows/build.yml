name: Compilar firmware ESP32

on:
  push:
    branches:
      - '**'

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Instalar dependencias del sistema
      run: |
        sudo apt update
        sudo apt install -y git wget flex bison gperf python3 python3-pip cmake ninja-build ccache libffi-dev libssl-dev dfu-util

    - name: Configurar ESP-IDF
      run: |
        mkdir -p ~/esp
        cd ~/esp
        git clone --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        ./install.sh esp32
        echo "source ~/esp/esp-idf/export.sh" >> $GITHUB_ENV

    - name: Exportar entorno ESP-IDF
      run: |
        source ~/esp/esp-idf/export.sh

    - name: Compilar firmware
      run: |
        source ~/esp/esp-idf/export.sh
        ls -la
        idf.py build