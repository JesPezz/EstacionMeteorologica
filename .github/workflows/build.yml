name: Compilar firmware ESP32

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget flex bison gperf python3 python3-pip cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

    - name: Configurar ESP-IDF
      run: |
        mkdir -p ~/esp
        cd ~/esp
        git clone --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        ./install.sh esp32
        echo "source $HOME/esp/esp-idf/export.sh" >> $HOME/.bashrc

    - name: Compilar firmware
      run: |
        source $HOME/esp/esp-idf/export.sh
        cd $GITHUB_WORKSPACE
        idf.py set-target esp32
        idf.py build