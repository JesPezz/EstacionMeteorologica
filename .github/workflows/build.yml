name: Compilar firmware ESP32

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          pip3 install pyserial

      - name: Clonar ESP-IDF
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout v4.4
          ./install.sh esp32

      - name: Configurar entorno ESP-IDF
        run: |
          source $GITHUB_WORKSPACE/esp-idf/export.sh
          idf.py build
        shell: bash

      - name: Subir binarios como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: firmware-bin
          path: build/*.bin