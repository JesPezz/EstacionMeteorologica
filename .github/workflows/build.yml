name: Compilar firmware ESP32

on:
  push:
    branches:
      - main  # o la rama que prefieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de compilación
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4  # Ajusta según tu versión

      - name: Compilar firmware
        run: idf.py build

      - name: Subir artefacto binario
        uses: actions/upload-artifact@v3
        with:
          name: firmware-bin
          path: build/*.bin