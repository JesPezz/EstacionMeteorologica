<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Meteorológica MQTT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2><i class="fas fa-heartbeat"></i> Estado Actual</h2>
            <div class="status-header">
                <span>📍 <span id="location-display">--</span></span>
                <div class="status-summary-right">
                    <div>📶 <span id="wifi-ssid">--</span></div>
                    <div>📡 <span id="esp-ip">--</span></div>
                </div>
            </div>
            
            <div class="sensor-grid">
                <div class="sensor-box">
                    <span class="sensor-value"><span id="temp">--</span> °C</span>
                    <span class="sensor-label">Temperatura</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="humidity">--</span> %</span>
                    <span class="sensor-label">Humedad</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="air_quality">--</span></span>
                    <span class="sensor-label">IAQ (<span id="precision">--</span>)</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="pressure">--</span> hPa</span>
                    <span class="sensor-label">Presión</span>
                </div>
            </div>
            <div class="status-version">
                Versión: <span id="version">--</span>
            </div>
        </div>

        <div class="card config-section">
            <h2><i class="fas fa-cog"></i> Configuración MQTT</h2>
            <form id="configForm">
                <div class="form-group">
<label for="location">📍 Ubicación del Sensor</label>
            <input type="text" id="location" name="location">

            <label for="altitude">⛰️ Altitud (metros s.n.m.)</label>
            <input type="number" id="altitude" step="0.1" placeholder="Ej: 2240.5">

            <h3>☁️ ThingSpeak</h3>
            <div class="form-group">
                <label for="thingSpeakAPIKey">API Key (Write)</label>
                <input type="text" id="thingSpeakAPIKey" placeholder="XXXXXXXXXXXX">

                <label for="channelID">Channel ID</label>
                        <input type="number" id="channelID">
                    </div>
                    
                    <h3>📡 Servidor MQTT</h3>
                    <div class="mqtt-grid">
                        <div>
                            <label for="mqttServer">Host / IP</label>
                            <input type="text" id="mqttServer">
                        </div>
                        <div>
                            <label for="mqttPort">Puerto</label>
                            <input type="number" id="mqttPort">
                        </div>
                    </div>

                    <label for="mqttUser">Usuario MQTT</label>
                    <input type="text" id="mqttUser">

                    <label for="mqttPassword">Contraseña MQTT</label>
                    <input type="password" id="mqttPassword">

                    <label for="mqttTopic">Tópico Base</label>
                    <input type="text" id="mqttTopic">
                    
                    <h3>🔔 Notificaciones & OTA</h3>
                    <label for="telegramToken">Token Telegram</label>
                    <input type="password" id="telegramToken">
                    
                    <label for="chatId">Chat ID Telegram</label>
                    <input type="text" id="chatId">

                    <label for="updateOta">Intervalo OTA (horas)</label>
                    <input type="number" id="updateOta" min="1">
                </div>
                
                <button type="submit">Guardar Configuración</button>
            </form>

            <div class="config-actions">
                <button onclick="downloadLog()" class="btn-secondary"><i class="fas fa-file-alt"></i> Log</button>
                <button onclick="confirmRestart()" class="btn-secondary btn-danger"><i class="fas fa-power-off"></i> Reiniciar</button>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-wifi"></i> WiFi</h2>
            <div class="wifi-card-header">
                <span>Redes Disponibles</span>
                <button id="refresh-wifi" title="Actualizar redes"><i class="fas fa-sync-alt"></i><span class="sr-only">Actualizar redes</span></button>
            </div>
            <div id="wifi-list-container"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-cloud-upload-alt"></i> Actualizar Firmware</h2>
            <label for="firmwareFile">Archivo firmware</label>
            <input type="file" id="firmwareFile" accept=".bin">
            <button onclick="uploadFirmware()">Subir .bin</button>
            <div id="otaStatus" class="status-version">0%</div>
            <div class="ota-progress-container">
                <div id="progressFill" class="progress-track"></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2>🔐 Acceso</h2>
            <form id="loginForm">
                <label for="username" class="sr-only">Usuario</label>
                <input type="text" id="username" placeholder="Usuario" autocomplete="username">
                <label for="password" class="sr-only">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <div id="wifiModal" class="modal">
        <div class="modal-content">
            <h3>Conectar a <span id="currentSSID"></span></h3>
            <label for="wifiPassword" class="sr-only">Contraseña WiFi</label>
            <input type="password" id="wifiPassword" placeholder="Contraseña WiFi">
            <div class="modal-actions">
                <button id="connectWifiBtn">Conectar</button>
                <button onclick="document.getElementById('wifiModal').style.display='none'" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Cargando...</div>
    </div>
    
    <div id="toast" class="toast"></div>

<script>
    let authToken = null;
    let selectedNetwork = null;

    // --- API & DATA ---
    async function apiCall(endpoint, options = {}) {
        if (authToken) {
            options.headers = { ...options.headers, 'Authorization': `Basic ${authToken}` };
        }
        const res = await fetch(endpoint, options);
        if (res.status === 401) {
            document.getElementById('authModal').style.display = 'flex';
            throw new Error('Unauthorized');
        }
        return res;
    }

    async function login(e) {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        authToken = btoa(`${u}:${p}`);
        
        try {
            toggleLoading(true);
            const res = await apiCall('/getConfig');
            if (res.ok) {
                const config = await res.json();
                loadConfigToForm(config);
                document.getElementById('authModal').style.display = 'none';
                startDashboard();
                showToast('Bienvenido', 'success');
            } else {
                showToast('Credenciales incorrectas', 'error');
            }
        } catch (err) {
            console.error(err);
            showToast('Error de conexión', 'error');
        } finally {
            toggleLoading(false);
        }
    }

    function loadConfigToForm(config) {
        document.getElementById('location').value = config.location || '';
        document.getElementById('altitude').value = config.altitude || 0;
        document.getElementById('thingSpeakAPIKey').value = config.thingSpeakAPIKey || '';
        document.getElementById('channelID').value = config.channelID || '';
        document.getElementById('location-display').innerText = config.location || 'Desconocida';
        document.getElementById('telegramToken').value = config.telegramToken || '';
        document.getElementById('chatId').value = config.chatId || '';
        document.getElementById('updateOta').value = (config.updateOta / 3600000) || 1;

        // MQTT
        document.getElementById('mqttServer').value = config.mqttServer || '';
        document.getElementById('mqttPort').value = config.mqttPort || 1883;
        document.getElementById('mqttUser').value = config.mqttUser || '';
        document.getElementById('mqttPassword').value = config.mqttPassword || '';
        document.getElementById('mqttTopic').value = config.mqttTopic || '';
    }

    async function saveConfig(e) {
        e.preventDefault();
        toggleLoading(true, 'Guardando...');
        
        const data = {
            location: document.getElementById('location').value,
            altitude: parseFloat(document.getElementById('altitude').value),
            thingSpeakAPIKey: document.getElementById('thingSpeakAPIKey').value,
            channelID: parseInt(document.getElementById('channelID').value),
            telegramToken: document.getElementById('telegramToken').value,
            chatId: document.getElementById('chatId').value,
            updateOta: parseInt(document.getElementById('updateOta').value),
            
            // MQTT
            mqttServer: document.getElementById('mqttServer').value,
            mqttPort: parseInt(document.getElementById('mqttPort').value),
            mqttUser: document.getElementById('mqttUser').value,
            mqttPassword: document.getElementById('mqttPassword').value,
            mqttTopic: document.getElementById('mqttTopic').value
        };

        // 🛑 CORRECCIÓN: Envolver el JSON en un parámetro 'plain'
        const jsonString = JSON.stringify(data);
        const formBody = 'plain=' + encodeURIComponent(jsonString);

        try {
            await apiCall('/config', {
                method: 'POST',
                // Usamos el tipo de contenido estándar para formularios
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formBody
            });
            showToast('Configuración guardada. Reiniciando...', 'success');
            setTimeout(() => location.reload(), 5000);
        } catch (err) {
            showToast('Error al guardar', 'error');
        } finally {
            toggleLoading(false);
        }
    }

    async function updateSensorData() {
        try {
            const res = await apiCall('/sensor_data');
            const data = await res.json();
            
            document.getElementById('temp').innerText = data.temp?.toFixed(1) || '--';
            document.getElementById('humidity').innerText = data.humidity?.toFixed(1) || '--';
            document.getElementById('pressure').innerText = data.pressure?.toFixed(1) || '--';
            document.getElementById('air_quality').innerText = data.air_quality?.toFixed(1) || '--';
            document.getElementById('precision').innerText = data.precision || '--';
            document.getElementById('version').innerText = data.version || '--';
        } catch(e) { console.log(e); }
    }

    async function updateESPStatus() {
        try {
            const res = await apiCall('/esp_status');
            const data = await res.json();
            document.getElementById('esp-ip').innerText = data.ip;
            document.getElementById('wifi-ssid').innerText = data.ssid || 'Desconectado';
        } catch(e) {}
    }

    // --- SYSTEM ---
    function startDashboard() {
        updateSensorData();
        updateESPStatus();
        scanNetworks();
        
        setInterval(updateSensorData, 5000);
        setInterval(updateESPStatus, 10000);
        
        // SSE Simplificado (Sin updateChart)
        const evtSource = new EventSource('/events');
        evtSource.addEventListener('update', () => updateSensorData());
    }

    // --- WIFI ---
    async function scanNetworks() {
        const res = await apiCall('/api/wifi/scan');
        const nets = await res.json();
        const container = document.getElementById('wifi-list-container');
        container.innerHTML = nets.map(n => `
            <div class="network-item" onclick="promptWifi('${n.ssid}')">
                <span><b>${n.ssid}</b> (${n.rssi} dBm)</span>
                <span>${n.secured ? '🔒' : '🔓'}</span>
            </div>
        `).join('');
    }

    function promptWifi(ssid) {
        selectedNetwork = ssid;
        document.getElementById('currentSSID').innerText = ssid;
        document.getElementById('wifiModal').style.display = 'flex';
    }

    document.getElementById('connectWifiBtn').onclick = async () => {
        const pass = document.getElementById('wifiPassword').value;
        toggleLoading(true, 'Conectando...');
        try {
            await apiCall('/saveWiFi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ssid: selectedNetwork, password: pass })
            });
            showToast('WiFi guardado. Reiniciando...', 'success');
            setTimeout(() => location.reload(), 10000);
        } catch { showToast('Error al guardar WiFi', 'error'); }
    };

    // --- UTILS ---
    function toggleLoading(show, text = 'Cargando...') {
        document.getElementById('loading').style.display = show ? 'flex' : 'none';
        document.getElementById('loadingText').innerText = text;
    }
    
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.className = `toast ${type}`;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }
    
    function confirmRestart() {
        if(confirm('¿Reiniciar ESP32?')) {
            apiCall('/restart', { method: 'POST' });
        }
    }
    
    function uploadFirmware() {
        const file = document.getElementById('firmwareFile').files[0];
        if(!file) return showToast('Selecciona un archivo', 'error');
        
        const data = new FormData();
        data.append('update', file);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/update', true);
        xhr.upload.onprogress = e => {
            const p = Math.round((e.loaded / e.total) * 100);
            document.getElementById('otaStatus').innerText = p + '%';
            document.getElementById('progressFill').style.width = p + '%';
        };
        xhr.onload = () => {
            if(xhr.status === 200) showToast('Actualizado. Reiniciando...', 'success');
            else showToast('Error en subida', 'error');
        };
        xhr.send(data);
    }
    
    function downloadLog() {
        if(authToken) window.location.href = '/downloadLog'; 
    }

    document.getElementById('loginForm').onsubmit = login;
    document.getElementById('configForm').onsubmit = saveConfig;
    document.getElementById('refresh-wifi').onclick = scanNetworks;
</script>
</body>
</html>
