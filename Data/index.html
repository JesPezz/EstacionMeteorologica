<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración ESP32</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); }
        form { max-width: 400px; margin: auto; }
        input, label { display: block; width: 100%; margin: 10px 0; }
        button { padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #45a049; }
        .data { font-size: 20px; margin: 10px 0; }
        .refresh-btn { background: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 5px; font-size: 16px; }
        .refresh-btn:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Configuración del ESP32</h2>
        <form action="/config" method="POST">
            <label for="ssid">SSID:</label>
            <input type="text" id="ssid" name="ssid" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">

            <label for="googleSheetURL">Google Sheet URL:</label>
            <input type="text" id="googleSheetURL" name="googleSheetURL">

            <label for="thingSpeakAPIKey">ThingSpeak API Key:</label>
            <input type="text" id="thingSpeakAPIKey" name="thingSpeakAPIKey">

            <label for="channelID">Channeln ID:</label>
            <input type="number" id="channelID" name="channelID">

            <label for="location">Ubicación:</label>
            <input type="text" id="location" name="location">

            <button type="submit">Guardar Configuración</button>
        </form>

        <h2>Datos Meteorológicos</h2>
        <p class="data">🌡️ Temperatura: <span id="temp">--</span>°C</p>
        <p class="data">💧 Humedad: <span id="humidity">--</span>%</p>
        <p class="data">🌪️ Presión: <span id="pressure">--</span> hPa</p>
        <button class="refresh-btn" onclick="updateData()">🔄 Actualizar</button>

        <h2>Actualización OTA</h2>
        <form id="otaForm">
            <input type="file" id="firmwareFile">
            <button type="button" onclick="uploadFirmware()">Subir Firmware</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        function uploadFirmware() {
            let fileInput = document.getElementById("firmwareFile");
            let file = fileInput.files[0];
            if (!file) {
                alert("Selecciona un archivo primero.");
                return;
            }

            let formData = new FormData();
            formData.append("firmware", file);

            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/update", true);

            xhr.upload.onprogress = function(event) {
                let percent = Math.round((event.loaded / event.total) * 100);
                document.getElementById("status").innerText = "Subiendo: " + percent + "%";
            };

            xhr.onload = function() {
                if (xhr.status == 200) {
                    document.getElementById("status").innerText = "✅ Actualización completada. Reiniciando...";
                    setTimeout(() => {
                        location.reload();
                    }, 3000);
                } else {
                    document.getElementById("status").innerText = "❌ Error en la actualización.";
                }
            };

            xhr.send(formData);
        }

        function updateData() {
            fetch('/getData')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('temp').textContent = data.temperatura;
                    document.getElementById('humidity').textContent = data.humedad;
                    document.getElementById('pressure').textContent = data.presion;
                })
                .catch(error => console.error('Error al obtener datos:', error));
        }

        document.addEventListener("DOMContentLoaded", function() {
            fetch("/getConfig")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("ssid").value = data.ssid;
                    document.getElementById("googleSheetURL").value = data.googleSheetURL;
                    document.getElementById("thingSpeakAPIKey").value = data.thingSpeakAPIKey;
                    document.getElementById("updateInterval").value = data.updateInterval;
                    document.getElementById("channelID").value = data.channelID;
                    document.getElementById("location").value = data.location;
                })
                .catch(error => console.error("Error cargando configuración:", error));
        });

        window.onload = updateData;
    </script>
</body>
</html>
