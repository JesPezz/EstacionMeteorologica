<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Meteorológica MQTT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">

    <style>
        :root{
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #0b74de;
            --accent: #10b981;
            --text: #17202a;
            --muted: #6b7280;
            --error: #ef4444;
            --card-radius: 10px;
            --gap: 1rem;
            --max-width: 1200px;
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:var(--text);}
        .dashboard{
            max-width:var(--max-width);
            margin:24px auto;
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap:var(--gap);
            padding:0 16px;
        }
        .card{
            background:var(--card);
            border-radius:var(--card-radius);
            padding:16px;
            box-shadow:0 6px 18px rgba(15,23,42,0.06);
            border:1px solid rgba(15,23,42,0.04);
        }
        .card h2{margin:0 0 12px 0;font-size:1.1rem;display:flex;align-items:center;gap:8px}

        .status-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted)}
        .status-summary-right{display:flex;gap:8px;align-items:center}

        .sensor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
        .sensor-box{background:linear-gradient(180deg, rgba(15,23,42,0.02), transparent);border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:flex-start}
        .sensor-value{font-weight:700;font-size:1.15rem}
        .sensor-label{color:var(--muted);font-size:0.85rem}

        .status-version{margin-top:12px;color:var(--muted);font-size:0.85rem}

        form .form-group{display:flex;flex-direction:column;gap:8px}
        label{font-size:0.9rem}
        input[type="text"], input[type="number"], input[type="password"], input[type="file"]{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(15,23,42,0.08);background:transparent}
        button{cursor:pointer;padding:10px 14px;border-radius:8px;border:none;background:var(--primary);color:white;font-weight:600}
        .btn-secondary{background:transparent;border:1px solid rgba(15,23,42,0.08);color:var(--text);padding:8px 12px}
        .btn-danger{background:var(--error);color:white}

        .config-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

        .mqtt-grid{display:flex;gap:8px}
        .mqtt-grid > div{flex:1}

        /* WiFi list */
        .network-item{display:flex;justify-content:space-between;padding:8px;border-radius:6px;margin-bottom:6px;background:#f8fafc;border:1px solid rgba(15,23,42,0.03)}

        /* Modal */
        .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,0.45);z-index:40}
        .modal-content{background:var(--card);padding:16px;border-radius:8px;min-width:260px}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

        /* Loading overlay */
        .loading-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.6);z-index:50}
        .spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(0,0,0,0.06);border-top-color:var(--primary);animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* OTA progress */
        .ota-progress-container{background:#e6eef9;border-radius:8px;height:10px;margin-top:8px}
        .progress-track{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:8px}

        /* Toast */
        .toast{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:8px;background:var(--card);box-shadow:0 6px 18px rgba(15,23,42,0.06);display:none}
        .toast.success{border-left:4px solid var(--accent)}
        .toast.error{border-left:4px solid var(--error)}

        /* Accessibility helpers */
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

        @media (max-width:480px){
            .dashboard{padding:12px}
            .card{padding:12px}
            .sensor-value{font-size:1rem}
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2><i class="fas fa-heartbeat"></i> Estado Actual</h2>
            <div class="status-header">
                <span>📍 <span id="location-display">--</span></span>
                <div class="status-summary-right">
                    <div>📶 <span id="wifi-ssid">--</span></div>
                    <div>📡 <span id="esp-ip">--</span></div>
                </div>
            </div>
            
            <div class="sensor-grid">
                <div class="sensor-box">
                    <span class="sensor-value"><span id="temp">--</span> °C</span>
                    <span class="sensor-label">Temperatura</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="humidity">--</span> %</span>
                    <span class="sensor-label">Humedad</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="air_quality">--</span></span>
                    <span class="sensor-label">IAQ (<span id="precision">--</span>)</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="pressure">--</span> hPa</span>
                    <span class="sensor-label">Presión</span>
                </div>
                <div class="sensor-box">
                    <span class="sensor-value"><span id="battery_display">--</span></span>
                    <span class="sensor-label">Batería</span>
                </div>
            </div>
            <div class="status-version">
                Versión: <span id="version">--</span>
            </div>
        </div>

        <div class="card config-section">
            <h2><i class="fas fa-cog"></i> Configuración MQTT</h2>
            <form id="configForm">
                <div class="form-group">
<label for="location">📍 Ubicación del Sensor</label>
            <input type="text" id="location" name="location">

            <label for="altitude">⛰️ Altitud (metros s.n.m.)</label>
            <input type="number" id="altitude" step="0.1" placeholder="Ej: 2240.5">

            <h3>☁️ ThingSpeak</h3>
            <div class="form-group">
                <label for="thingSpeakAPIKey">API Key (Write)</label>
                <input type="text" id="thingSpeakAPIKey" placeholder="XXXXXXXXXXXX">

                <label for="channelID">Channel ID</label>
                        <input type="number" id="channelID">
                    </div>
                    
                    <h3>📡 Servidor MQTT</h3>
                    <div class="mqtt-grid">
                        <div>
                            <label for="mqttServer">Host / IP</label>
                            <input type="text" id="mqttServer">
                        </div>
                        <div>
                            <label for="mqttPort">Puerto</label>
                            <input type="number" id="mqttPort">
                        </div>
                    </div>

                    <label for="mqttUser">Usuario MQTT</label>
                    <input type="text" id="mqttUser">

                    <label for="mqttPassword">Contraseña MQTT</label>
                    <input type="password" id="mqttPassword">

                    <label for="mqttTopic">Tópico Base</label>
                    <input type="text" id="mqttTopic">
                    
                    <h3>🔔 Notificaciones & OTA</h3>
                    <label for="telegramToken">Token Telegram</label>
                    <input type="password" id="telegramToken">
                    
                    <label for="chatId">Chat ID Telegram</label>
                    <input type="text" id="chatId">

                    <label for="updateOta">Intervalo OTA (horas)</label>
                    <input type="number" id="updateOta" min="1">
                </div>
                
                <button type="submit">Guardar Configuración</button>
            </form>

            <div class="config-actions">
                <button onclick="downloadLog()" class="btn-secondary"><i class="fas fa-file-alt"></i> Log</button>
                <button onclick="confirmRestart()" class="btn-secondary btn-danger"><i class="fas fa-power-off"></i> Reiniciar</button>
            </div>
        </div>

        <div class="card">
            <h2><i class="fas fa-wifi"></i> WiFi</h2>
            <div class="wifi-card-header">
                <span>Redes Disponibles</span>
                <button id="refresh-wifi" title="Actualizar redes"><i class="fas fa-sync-alt"></i><span class="sr-only">Actualizar redes</span></button>
            </div>
            <div id="wifi-list-container"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-cloud-upload-alt"></i> Actualizar Firmware</h2>
            <label for="firmwareFile">Archivo firmware</label>
            <input type="file" id="firmwareFile" accept=".bin">
            <button onclick="uploadFirmware()">Subir .bin</button>
            <div id="otaStatus" class="status-version">0%</div>
            <div class="ota-progress-container">
                <div id="progressFill" class="progress-track"></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2>🔐 Acceso</h2>
            <form id="loginForm">
                <label for="username" class="sr-only">Usuario</label>
                <input type="text" id="username" placeholder="Usuario" autocomplete="username">
                <label for="password" class="sr-only">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <div id="wifiModal" class="modal">
        <div class="modal-content">
            <h3>Conectar a <span id="currentSSID"></span></h3>
            <label for="wifiPassword" class="sr-only">Contraseña WiFi</label>
            <input type="password" id="wifiPassword" placeholder="Contraseña WiFi">
            <div class="modal-actions">
                <button id="connectWifiBtn">Conectar</button>
                <button onclick="document.getElementById('wifiModal').style.display='none'" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Cargando...</div>
    </div>
    
    <div id="toast" class="toast"></div>

<script>
    let authToken = null;
    let selectedNetwork = null;

    // --- API & DATA ---
    // Basic API call helper. Does NOT auto-show modal on 401 so callers can decide to prompt for credentials.
    async function apiCall(endpoint, options = {}) {
        if (authToken) {
            options.headers = { ...options.headers, 'Authorization': `Basic ${authToken}` };
        }
        const res = await fetch(endpoint, options);
        return res;
    }

    // Pending admin action to retry after successful login
    let pendingAdminAction = null;

    // Attempt login with given username/password. Returns a promise that resolves true on success, false on failure.
    async function attemptLogin(username, password) {
        authToken = btoa(`${username}:${password}`);
        try {
            toggleLoading(true, 'Verificando credenciales...');
            const res = await apiCall('/getConfig');
            if (res.ok) {
                const config = await res.json();
                loadConfigToForm(config);
                document.getElementById('authModal').style.display = 'none';
                showToast('Acceso concedido', 'success');

                // If there was a pending admin action, run it now
                if (pendingAdminAction) {
                    const f = pendingAdminAction;
                    pendingAdminAction = null;
                    try { await f(); } catch (e) { console.warn('Pending action failed after login', e); }
                }
                return true;
            } else {
                authToken = null; // clear token on bad auth
                showToast('Credenciales incorrectas', 'error');
                return false;
            }
        } catch (err) {
            console.error('attemptLogin error', err);
            authToken = null;
            showToast('Error de conexión', 'error');
            return false;
        } finally {
            toggleLoading(false);
        }
    }

    async function login(e) {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        await attemptLogin(u, p);
    }

    function loadConfigToForm(config) {
        document.getElementById('location').value = config.location || '';
        document.getElementById('altitude').value = config.altitude || 0;
        document.getElementById('thingSpeakAPIKey').value = config.thingSpeakAPIKey || '';
        document.getElementById('channelID').value = config.channelID || '';
        document.getElementById('location-display').innerText = config.location || 'Desconocida';
        document.getElementById('telegramToken').value = config.telegramToken || '';
        document.getElementById('chatId').value = config.chatId || '';
        document.getElementById('updateOta').value = (config.updateOta / 3600000) || 1;

        // MQTT
        document.getElementById('mqttServer').value = config.mqttServer || '';
        document.getElementById('mqttPort').value = config.mqttPort || 1883;
        document.getElementById('mqttUser').value = config.mqttUser || '';
        document.getElementById('mqttPassword').value = config.mqttPassword || '';
        document.getElementById('mqttTopic').value = config.mqttTopic || '';
    }

    async function sendConfig(data) {
        const jsonString = JSON.stringify(data);
        const formBody = 'plain=' + encodeURIComponent(jsonString);
        try {
            const res = await apiCall('/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formBody
            });
            if (res.status === 401) {
                // require auth: show modal and enqueue
                document.getElementById('authModal').style.display = 'flex';
                pendingAdminAction = async () => { await sendConfig(data); };
                return false;
            }
            if (!res.ok) {
                showToast('Error al guardar', 'error');
                return false;
            }
            showToast('Configuración guardada. Reiniciando...', 'success');
            setTimeout(() => location.reload(), 5000);
            return true;
        } catch (err) {
            console.error('sendConfig error', err);
            showToast('Error al guardar', 'error');
            return false;
        }
    }

    async function saveConfig(e) {
        e.preventDefault();
        toggleLoading(true, 'Guardando...');
        const data = {
            location: document.getElementById('location').value,
            altitude: parseFloat(document.getElementById('altitude').value),
            thingSpeakAPIKey: document.getElementById('thingSpeakAPIKey').value,
            channelID: parseInt(document.getElementById('channelID').value),
            telegramToken: document.getElementById('telegramToken').value,
            chatId: document.getElementById('chatId').value,
            updateOta: parseInt(document.getElementById('updateOta').value),
            mqttServer: document.getElementById('mqttServer').value,
            mqttPort: parseInt(document.getElementById('mqttPort').value),
            mqttUser: document.getElementById('mqttUser').value,
            mqttPassword: document.getElementById('mqttPassword').value,
            mqttTopic: document.getElementById('mqttTopic').value
        };
        await sendConfig(data);
        toggleLoading(false);
    }

    async function updateSensorData() {
        try {
            const res = await apiCall('/sensor_data');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            const setText = (id, value) => { const el = document.getElementById(id); if (el) el.innerText = value; };

            setText('temp', (typeof data.temp === 'number') ? data.temp.toFixed(1) : '--');
            setText('humidity', (typeof data.humidity === 'number') ? data.humidity.toFixed(1) : '--');
            setText('pressure', (typeof data.pressure === 'number') ? data.pressure.toFixed(1) : '--');
            setText('air_quality', (typeof data.air_quality === 'number') ? data.air_quality.toFixed(1) : '--');
            setText('precision', (typeof data.precision === 'string') ? data.precision : (data.precision || '--'));
            setText('version', data.version || '--');

            // Mostrar estado/voltaje de batería con checks de existencia
            try {
                const display = document.getElementById('battery_display');
                if (display) {
                    const battStatus = (typeof data.battery_status === 'string') ? data.battery_status : 'unknown';
                    const battVolt = (data.battery_voltage !== undefined && data.battery_voltage !== null) ? parseFloat(data.battery_voltage) : NaN;

                    if (battStatus === 'absent') {
                        display.innerText = 'Ausente';
                        display.style.color = 'var(--error)';
                    } else if (battStatus === 'undervoltage') {
                        display.innerText = (!isNaN(battVolt) ? battVolt.toFixed(2) : '--') + ' V (Baja)';
                        display.style.color = 'var(--error)';
                    } else if (battStatus === 'ok') {
                        display.innerText = !isNaN(battVolt) ? battVolt.toFixed(2) + ' V' : '--';
                        display.style.color = 'var(--primary)';
                    } else {
                        display.innerText = '--';
                        display.style.color = '';
                    }
                }
            } catch (e) { console.warn('Error mostrando batería', e); }

        } catch (err) {
            console.error('updateSensorData error', err);
        }
    }

    async function updateESPStatus() {
        try {
            const res = await apiCall('/esp_status');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const setText = (id, value) => { const el = document.getElementById(id); if (el) el.innerText = value; };
            setText('esp-ip', data.ip || '--');
            setText('wifi-ssid', data.ssid || 'Desconectado');
        } catch (err) {
            console.error('updateESPStatus error', err);
        }
    }

    // --- SYSTEM ---
    function startDashboard() {
        updateSensorData();
        updateESPStatus();
        scanNetworks();
        
        setInterval(updateSensorData, 5000);
        setInterval(updateESPStatus, 10000);
        
        const evtSource = new EventSource('/events');
        evtSource.onopen = () => console.log('SSE connected');
        evtSource.onerror = (e) => console.warn('SSE error', e);
        evtSource.addEventListener('update', () => {
            try {
                updateSensorData();
            } catch (err) {
                console.warn('SSE update handling error', err);
            }
        });
    }

    // Auto-start dashboard and load config when page opens (no login required to show read-only data)
    document.addEventListener('DOMContentLoaded', () => {
        try {
            startDashboard();
            apiCall('/getConfig')
                .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                .then(config => loadConfigToForm(config))
                .catch(err => console.warn('Config check:', err));
        } catch (e) { console.warn('Auto-start failed', e); }
    });

    // --- WIFI ---
    async function scanNetworks() {
        const res = await apiCall('/api/wifi/scan');
        const nets = await res.json();
        const container = document.getElementById('wifi-list-container');
        container.innerHTML = nets.map(n => `
            <div class="network-item" onclick="promptWifi('${n.ssid}')">
                <span><b>${n.ssid}</b> (${n.rssi} dBm)</span>
                <span>${n.secured ? '🔒' : '🔓'}</span>
            </div>
        `).join('');
    }

    function promptWifi(ssid) {
        selectedNetwork = ssid;
        document.getElementById('currentSSID').innerText = ssid;
        document.getElementById('wifiModal').style.display = 'flex';
    }

    async function sendSaveWiFi(obj) {
        try {
            const res = await apiCall('/saveWiFi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(obj)
            });
            if (res.status === 401) {
                document.getElementById('authModal').style.display = 'flex';
                pendingAdminAction = async () => { await sendSaveWiFi(obj); };
                return false;
            }
            if (!res.ok) { showToast('Error al guardar WiFi', 'error'); return false; }
            showToast('WiFi guardado. Reiniciando...', 'success');
            setTimeout(() => location.reload(), 10000);
            return true;
        } catch (e) { console.error('sendSaveWiFi error', e); showToast('Error al guardar WiFi', 'error'); return false; }
    }

    document.getElementById('connectWifiBtn').onclick = async () => {
        const pass = document.getElementById('wifiPassword').value;
        toggleLoading(true, 'Conectando...');
        await sendSaveWiFi({ ssid: selectedNetwork, password: pass });
        toggleLoading(false);
    };

    // --- UTILS ---
    function toggleLoading(show, text = 'Cargando...') {
        document.getElementById('loading').style.display = show ? 'flex' : 'none';
        document.getElementById('loadingText').innerText = text;
    }
    
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.className = `toast ${type}`;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }
    
    function confirmRestart() {
        if(confirm('¿Reiniciar ESP32?')) {
            apiCall('/restart', { method: 'POST' });
        }
    }
    
    function uploadFirmware() {
        const file = document.getElementById('firmwareFile').files[0];
        if(!file) return showToast('Selecciona un archivo', 'error');

        // If no auth yet, request auth first and retry
        if (!authToken) {
            document.getElementById('authModal').style.display = 'flex';
            pendingAdminAction = uploadFirmware;
            return;
        }

        const data = new FormData();
        data.append('update', file);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/update', true);
        // Attach Basic Auth header if available
        if (authToken) {
            xhr.setRequestHeader('Authorization', 'Basic ' + authToken);
        }
        xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                document.getElementById('otaStatus').innerText = p + '%';
                document.getElementById('progressFill').style.width = p + '%';
            }
        };
        xhr.onload = () => {
            if(xhr.status === 200) showToast('Actualizado. Reiniciando...', 'success');
            else if (xhr.status === 401) {
                document.getElementById('authModal').style.display = 'flex';
                pendingAdminAction = uploadFirmware;
            } else showToast('Error en subida', 'error');
        };
        xhr.onerror = () => { showToast('Error en subida', 'error'); };
        xhr.send(data);
    }
    
    async function downloadLog() {
        try {
            toggleLoading(true, 'Descargando log...');
            const res = await apiCall('/downloadLog');
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'error.log';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();
            showToast('Log descargado correctamente', 'success');
        } catch (err) {
            console.error('Error al descargar log:', err);
            showToast('Error al descargar log', 'error');
        } finally {
            toggleLoading(false);
        }
    }

    document.getElementById('loginForm').onsubmit = login;
    document.getElementById('configForm').onsubmit = saveConfig;
    document.getElementById('refresh-wifi').onclick = scanNetworks;
</script>
</body>
</html>
